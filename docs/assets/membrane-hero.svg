<svg width="640" height="392" viewBox="0 0 640 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MEMBRANE resolves a GGUF model and context into GPU layer count, KV precision, and KV placement, then hands the plan to llama.cpp for generation.">
  <title>MEMBRANE planning flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ee6c8"/>
    </marker>
  </defs>

  <rect width="640" height="392" fill="#0d1117"/>

  <!-- Card 1: input -->
  <rect x="160" y="16" width="320" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="41" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" font-weight="600">model.gguf</text>
  <text x="320" y="63" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#8b949e">--ctx N</text>

  <line x1="320" y1="80" x2="320" y2="112" stroke="#5ee6c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 2: MEMBRANE planner -->
  <rect x="96" y="116" width="448" height="164" rx="10" fill="#131a20" stroke="#5ee6c8" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#5ee6c8" font-weight="700" letter-spacing="1">MEMBRANE</text>
  <line x1="120" y1="154" x2="520" y2="154" stroke="#21282e" stroke-width="1"/>

  <text x="120" y="180" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">GPU layers</text>
  <text x="520" y="180" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3" font-weight="600">auto</text>

  <text x="120" y="208" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">KV precision</text>
  <text x="520" y="208" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3" font-weight="600">adaptive -&gt; q8 / q5</text>

  <text x="120" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">KV placement</text>
  <text x="520" y="236" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3" font-weight="600">auto -&gt; gpu / cpu split</text>

  <text x="320" y="264" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-style="italic">illustrative values — resolved from real device memory and model shape</text>

  <line x1="320" y1="280" x2="320" y2="312" stroke="#5ee6c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 3: output -->
  <rect x="160" y="316" width="320" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="341" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" font-weight="600">llama.cpp</text>
  <text x="320" y="363" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#8b949e">resolved runtime -&gt; generation</text>
</svg>
