<svg width="760" height="500" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart across six tested contexts (512 to 16384) on SmolLM2-135M, GTX 1650, Vulkan: q8 KV VRAM reduction ranges from about 2 percent at small contexts to about 25 percent at context 16384, while generation throughput is about 7 to 18 percent lower than native across the same sweep.">
  <title>MEMBRANE q8 KV VRAM/throughput tradeoff</title>
  <rect width="760" height="500" fill="#0d1117"/>
<text x="30" y="30" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e" letter-spacing="1.5">MEASURED — SmolLM2-135M · GTX 1650 · Vulkan · tested contexts only</text>
<text x="30" y="54" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="700">q8 KV vs. native: VRAM and throughput tradeoff</text>
<text x="30" y="84" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#5ee6c8">VRAM reduction (%)</text>
