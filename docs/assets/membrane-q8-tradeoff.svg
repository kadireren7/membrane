<text x="225.0" y="179.8" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">3.0%</text>
<rect x="307.5" y="175.7" width="55.0" height="20.3" rx="3" fill="#5ee6c8" fill-opacity="0.85"/>
<text x="335.0" y="169.7" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">5.8%</text>
<rect x="417.5" y="159.9" width="55.0" height="36.1" rx="3" fill="#5ee6c8" fill-opacity="0.85"/>
<text x="445.0" y="153.9" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">10.4%</text>
<rect x="527.5" y="137.1" width="55.0" height="58.9" rx="3" fill="#5ee6c8" fill-opacity="0.85"/>
<text x="555.0" y="131.1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">17.0%</text>
<rect x="637.5" y="109.6" width="55.0" height="86.4" rx="3" fill="#5ee6c8" fill-opacity="0.85"/>
<text x="665.0" y="103.6" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">24.9%</text>
<text x="30" y="260" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#f85149">generation throughput vs. native (%)</text>
<line x1="60" y1="268" x2="720" y2="268" stroke="#30363d" stroke-width="1"/>
<rect x="87.5" y="268.0" width="55.0" height="36.0" rx="3" fill="#f85149" fill-opacity="0.85"/>
<text x="115.0" y="320.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">-6.9%</text>
