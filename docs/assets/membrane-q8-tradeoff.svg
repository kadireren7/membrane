<text x="225.0" y="341.9" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">-11.1%</text>
<rect x="307.5" y="268.0" width="55.0" height="91.1" rx="3" fill="#f85149" fill-opacity="0.85"/>
<text x="335.0" y="375.1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">-17.5%</text>
<rect x="417.5" y="268.0" width="55.0" height="63.3" rx="3" fill="#f85149" fill-opacity="0.85"/>
<text x="445.0" y="347.3" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">-12.2%</text>
<rect x="527.5" y="268.0" width="55.0" height="67.0" rx="3" fill="#f85149" fill-opacity="0.85"/>
<text x="555.0" y="351.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">-12.9%</text>
<rect x="637.5" y="268.0" width="55.0" height="55.0" rx="3" fill="#f85149" fill-opacity="0.85"/>
<text x="665.0" y="339.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">-10.6%</text>
<text x="115.0" y="406" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">ctx 512</text>
<text x="225.0" y="406" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">ctx 1024</text>
<text x="335.0" y="406" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">ctx 2048</text>
<text x="445.0" y="406" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">ctx 4096</text>
<text x="555.0" y="406" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">ctx 8192</text>
<text x="665.0" y="406" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">ctx 16384</text>
<text x="30" y="430" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">One model family, one GPU, one host — not a general VRAM or</text>
<text x="30" y="450" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">throughput claim. q8 reduces VRAM at every tested context; the</text>
<text x="30" y="470" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">reduction and the throughput cost both vary by context.</text>
</svg>
