<svg width="700" height="352" viewBox="0 0 700 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KV cache has two independent axes: representation, controlled by --kv (native, q8, q5, adaptive), and residency, controlled by --kv-placement (default, gpu, cpu, auto). Changing one never changes the other.">
  <title>Precision and placement are independent dimensions</title>
  <rect width="700" height="352" fill="#0d1117"/>

  <text x="350" y="34" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">KV CACHE — TWO INDEPENDENT AXES</text>

  <!-- left panel: representation -->
  <rect x="40" y="56" width="280" height="240" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="180" y="86" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#5ee6c8" font-weight="700">Representation</text>
  <text x="180" y="106" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">--kv</text>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e6edf3">
    <rect x="64" y="122" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="144" text-anchor="middle">native</text>
    <rect x="64" y="164" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="186" text-anchor="middle">q8</text>
    <rect x="64" y="206" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="228" text-anchor="middle">q5</text>
    <rect x="64" y="248" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="270" text-anchor="middle">adaptive</text>
  </g>

  <!-- divider -->
  <circle cx="350" cy="176" r="22" fill="#0d1117" stroke="#5ee6c8" stroke-width="1.5"/>
  <text x="350" y="182" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#5ee6c8" font-weight="700">×</text>

  <!-- right panel: residency -->
  <rect x="380" y="56" width="280" height="240" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="520" y="86" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#5ee6c8" font-weight="700">Residency</text>
  <text x="520" y="106" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">--kv-placement</text>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e6edf3">
    <rect x="404" y="122" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="520" y="144" text-anchor="middle">default</text>
    <rect x="404" y="164" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="520" y="186" text-anchor="middle">gpu</text>
    <rect x="404" y="206" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="520" y="228" text-anchor="middle">cpu</text>
    <rect x="404" y="248" width="232" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="520" y="270" text-anchor="middle">auto</text>
  </g>

  <text x="350" y="326" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Precision changes how KV is represented. Placement changes where KV lives. Changing one never changes the other.</text>
</svg>
