name: CI

on: [push, pull_request]

jobs:
  # Phase 18: validates docs/compatibility.json's schema, evidence-file
  # existence, and status-integrity invariants (no unsupported evidence
  # claims, no over-claiming NOT_YET_VALIDATED as proven). Deliberately
  # its own job, not folded into build-and-test: it needs only python3
  # and a checkout, no GPU, no model download, no C/C++ build at all.
  compatibility-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify compatibility matrix
        run: python3 scripts/verify-compatibility.py

  # Phase 19: validates results/planner-accuracy/measurements.json's
  # schema and error-field integrity (no fabricated error from a
  # missing real input, no GPU field on a CPU-backend measurement, no
  # claimed GPU peak this measurement method can't provide). Same
  # reasoning as compatibility-check above: python3 + checkout only, no
  # GPU, no model download, no C/C++ build -- this validates the
  # committed evidence file, it does not regenerate it.
  planner-accuracy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify planner accuracy measurements
        run: python3 scripts/verify-planner-accuracy.py

  # Phase 21: validates results/auto-fallback/validation.json's schema,
  # attempt-ordering/candidate-index invariants, and REAL-vs-SIMULATED
  # provenance (a REAL run may never claim a failure class this
  # project's real apply adapter has no API surface to prove). Same
  # reasoning as the two jobs above: python3 + checkout only, no GPU,
  # no model download, no C/C++ build -- this validates the committed
  # evidence file, it does not regenerate it.
  auto-fallback-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify auto-fallback validation evidence
        run: python3 scripts/verify-auto-fallback.py

  # Phase 24: validates the committed performance-profiling evidence
  # only -- python3 + checkout, no GPU, no model download, no C/C++
  # build, and (Section 26 of the Phase 24 task) no performance
  # benchmark or absolute-performance comparison ever runs in CI.
  performance-profile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify performance-profiling measurements
        run: python3 scripts/verify-performance-profiling.py

  # Phase 25: validates the committed performance-optimization evidence
  # only -- python3 + checkout, no GPU, no model download, no C/C++
  # build, and (Section 31 of the Phase 25 task) no absolute-performance
  # benchmark or threshold ever runs in CI.
  performance-optimization-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify performance-optimization evidence
        run: python3 scripts/verify-performance-optimization.py

  # Phase 26: validates the committed compat-expansion evidence only --
  # python3 + checkout, no GPU, no model download, no C/C++ build. Real
  # model runs (results/compat-expansion/validation.json's rows) were
  # captured locally against this repo's own committed GGUF fixtures;
  # this job checks that committed evidence file, it does not
  # regenerate it.
  compat-expansion-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify compat-expansion evidence
        run: python3 scripts/verify-compat-expansion.py

  # Phase 27 added this job checking CURRENT/live state (version,
  # compatibility counts, doc claims) while v0.3.0-rc3 was the latest
  # prerelease -- unlike scripts/verify-release-readiness.py (RC2's own
  # FROZEN historical facts via `git show <tag>:...`, retired from CI
  # the same way once RC2 was superseded). scripts/verify-release-rc3.py
  # reads the LIVE tree, not a pinned tag, so once main moves past RC3
  # (Phase 31: v0.3.0 stable) its assertions ("MEMBRANE_VERSION ==
  # 0.3.0-rc3", "CITATION.cff still targets v0.2.0", "no stable v0.3.0
  # claim exists") become permanently false by design -- retired here,
  # same precedent as verify-release-readiness.py before it. The script
  # FILE itself is untouched (still documents exactly what Phase 27
  # checked, unrewritten) -- only this CI wiring is removed.
  # scripts/verify-release-v0.3.0.py (Phase 31) is this job's
  # successor for the new live state.

  # Phase 28: validates the committed CLI-UX evidence
  # (results/cli-ux/validation.json) and doc/CLI consistency (every
  # documented flag actually exists in the real --help text, no stale
  # llama-only claim, no unsupported speed claim) -- python3 + checkout
  # only, no GPU, no model download, no C/C++ build. This validates the
  # committed evidence file (captured locally against a real build), it
  # does not regenerate it.
  cli-ux-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify CLI-UX evidence
        run: python3 scripts/verify-cli-ux.py

  # Phase 29: validates the committed distribution/.deb-packaging
  # evidence (results/distribution/validation.json) and version-mapping
  # consistency -- python3 + checkout only, no GPU, no model download,
  # no C/C++ build, no Docker. This validates the committed evidence
  # file (captured locally by actually building and installing both
  # .deb variants in a container -- see docs/install.md), it does not
  # regenerate it; the actual .deb build/install/uninstall smoke test
  # lives in packaging-smoke above, which builds real artifacts (no
  # .deb file itself is committed to this repository -- Section 24).
  distribution-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Phase 31: fetch-depth 0 (full history), not this job's previous
      # default shallow (depth-1) checkout -- scripts/verify-
      # distribution.py's version-consistency check now reads
      # results/distribution/validation.json's own captured_at_commit
      # via `git show <commit>:...` (a real historical commit, not
      # necessarily this PR's HEAD or its immediate parent), which a
      # shallow clone doesn't have -- confirmed as the real cause of
      # this job's first failure on this exact change (fatal: path
      # exists on disk, but not in <commit>).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify distribution evidence
        run: python3 scripts/verify-distribution.py

  # Phase 30: validates the committed release-artifact naming/packaging
  # POLICY (results/release-artifacts/manifest.json) -- no .deb file,
  # no C/C++ build, no GPU, no Docker. Checks the policy's internal
  # consistency and that CMakeLists.txt's CPack config actually
  # implements what this file documents; does not build or publish
  # anything.
  release-artifact-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release-artifact policy
        run: python3 scripts/verify-release-artifacts.py

  # Phase 30: validates the committed first-run UX evidence
  # (results/first-run/validation.json) -- python3 + checkout only, no
  # GPU, no model download, no C/C++ build, no Docker. This validates
  # the committed evidence file (captured locally: a real build on real
  # Vulkan hardware, and a real .deb install inside a container -- see
  # docs/install.md), it does not regenerate it.
  first-run-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Phase 31: fetch-depth 0 -- see distribution-check's own comment
      # above for why (scripts/verify-first-run.py's version-
      # consistency check has the same `git show <captured_at_commit>:
      # ...` dependency on full history).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify first-run UX evidence
        run: python3 scripts/verify-first-run.py

  # Phase 31: validates v0.3.0 stable-release readiness (live tree
  # state: MEMBRANE_VERSION, CITATION.cff, release notes, compatibility
  # counts, official package policy, external-validation disclosure, no
  # overclaim, README release status, and that the historical RC1/RC2/
  # RC3 release docs/evidence remain untouched) -- python3 + checkout
  # only, no GPU, no model download, no C/C++ build, no Docker. Same
  # standalone-script/own-CI-job pattern as cli-ux-check/distribution-
  # check/release-artifact-check/first-run-check above, not chained
  # into verify-results.py -- see scripts/verify-release-v0.3.0.py's
  # own docstring for why (this job is itself expected to need
  # retirement once a future release supersedes v0.3.0, same as
  # release-rc3-check before it -- see that job's removal in this same
  # phase for the precedent).
  release-v030-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify v0.3.0 stable-release readiness
        run: python3 scripts/verify-release-v0.3.0.py

  # Phase 32: validates the v0.4 product-direction/roadmap planning
  # documents (docs/product-direction.md, docs/v0.4-roadmap.md,
  # results/product-direction/v0.4-decision.json) -- no runtime code
  # changed this phase, so this is the only new check: required
  # sections exist, no CUDA implementation commitment, no performance-
  # speedup promise, no unsupported current-feature overclaim, live
  # v0.3 facts cited accurately, and the phase roadmap is ordered/
  # unique/sequential. python3 + checkout only.
  v04-roadmap-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify v0.4 product-direction/roadmap documents
        run: python3 scripts/verify-v0.4-roadmap.py

  # Phase 33: validates the safe-context-recommendation CORE's evidence
  # and docs (results/context-recommendation/core-validation.json,
  # docs/context-recommendation.md) -- no CLI surface exists yet
  # (--ctx auto ships in Phase 34), so there is nothing product-facing
  # to smoke-test here. python3 + checkout only, same shape as
  # v04-roadmap-check above; no GPU, no model download, no benchmark.
  # test_context_recommender itself needs no separate job: it is
  # registered unconditionally (tools/membrane-run/context_recommender.c
  # is llama-free -- no MEMBRANE_ENABLE_LLAMA needed), so the existing
  # build-and-test job's Debug/ASan matrix and the thread-sanitizer job
  # already build and ctest it on every run, with zero changes needed
  # here -- confirmed directly: `ctest --test-dir build-debug` (no
  # MEMBRANE_ENABLE_LLAMA) already runs and passes test_context_
  # recommender.
  context-recommendation-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify context recommendation core evidence and docs
        run: python3 scripts/verify-context-recommendation.py

  # Phase 34: validates the host-memory safety guard's evidence and
  # docs (results/host-memory-guard/validation.json, docs/host-memory-
  # guard.md) -- python3 + checkout only, same shape as
  # context-recommendation-check above; no GPU, no model download, no
  # benchmark. test_host_memory_guard itself needs no separate job for
  # the same reason test_context_recommender doesn't: it is registered
  # unconditionally (host_memory_guard.c is llama-free), so the
  # existing build-and-test job's Debug/ASan matrix and the thread-
  # sanitizer job already build and ctest it on every run.
  host-memory-guard-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify host-memory guard evidence and docs
        run: python3 scripts/verify-host-memory-guard.py

  # Phase 35: validates the --ctx auto CLI integration's evidence and
  # docs (results/context-recommendation/cli-validation.json, docs/
  # context-auto-cli.md) -- python3 + checkout only, same shape as
  # context-recommendation-check/host-memory-guard-check above; no
  # GPU, no model download, no benchmark. test_context_auto_cli and
  # the extended test_product_cli need no separate job for the same
  # reason the other pure-module tests don't: both are registered
  # unconditionally (llama-free), so the existing build-and-test job's
  # Debug/ASan matrix and the thread-sanitizer job already build and
  # ctest them on every run. The real membrane-run binary itself
  # (llama-linked, containing this phase's main.cpp changes) is
  # exercised by the existing packaging-smoke job, which now also
  # greps the installed --help output for "--ctx N|auto" (Section 45).
  context-auto-cli-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify --ctx auto CLI evidence and docs
        run: python3 scripts/verify-context-auto-cli.py

  # Mega Phase A, PR A4: validates the committed runtime-service evidence
  # (results/runtime-service/validation.json) and docs/server.md +
  # docs/model-registry.md only -- python3 + checkout, no GPU, no model
  # download, no C/C++ build. Same reasoning as every other *-check job:
  # this checks the committed evidence file (and a handful of direct
  # source-level regression guards for the real bugs this mega-phase
  # found and fixed), it does not regenerate it.
  runtime-service-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runtime-service evidence and docs
        run: python3 scripts/verify-runtime-service.py

  # Mega Phase B, PR B1: validates the committed background-service
  # evidence (results/background-service/validation.json), docs/
  # service.md, and a handful of direct source-level regression guards
  # (no /etc/systemd/system reference, no system()/popen() anywhere in
  # the new subprocess/service-command modules, install/uninstall's own
  # overwrite/ownership refusal logic, every new pure library actually
  # linking membrane_sanitizers) -- python3 + checkout only, no GPU, no
  # model download, no C/C++ build. Same reasoning as every other
  # *-check job: this validates the committed evidence file and source
  # tree, it does not regenerate or rebuild anything.
  background-service-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify background-service evidence and docs
        run: python3 scripts/verify-background-service.py

  # Mega Phase C, PR C1: validates the committed product-onboarding
  # evidence (results/product-onboarding/validation.json), README's own
  # mention of `membrane setup`/`membrane doctor`, and a handful of
  # direct source-level regression guards for this PR's own real
  # findings -- python3 + checkout only, no GPU, no model download, no
  # C/C++ build.
  product-onboarding-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify product-onboarding evidence and docs
        run: python3 scripts/verify-product-onboarding.py

  # Phase 21: exercises the fallback controller's own test suite
  # (llama-free, ASan/UBSan-friendly) plus test_joint_planner without
  # paying for a full llama.cpp/ggml build -- both are registered
  # inside the MEMBRANE_ENABLE_LLAMA CMake block (same convention as
  # every other *_policy.h module's own test executable in this
  # project), but neither their own library nor test binary links
  # llama/ggml at all, so a target-scoped `cmake --build --target ...`
  # only configures the tree (cheap, needs the submodule checked out)
  # and compiles these few pure-C translation units -- confirmed
  # directly: zero ggml/llama compilation occurs for this job's build
  # step. This is the ONLY CI coverage either test gets today (the
  # existing build-and-test/thread-sanitizer jobs never set
  # MEMBRANE_ENABLE_LLAMA, so targets registered inside that block,
  # including test_joint_planner since Phase 20, were never actually
  # running in CI before this job existed -- a pre-existing gap this
  # phase closes as a direct side effect, not a scope expansion: fixing
  # the broader llama-enabled build-and-test matrix itself is out of
  # scope for Phase 21).
  fallback-controller-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      # ASan/UBSan: target-scoped (see the Build step below), so
      # llama/ggml itself is never compiled at all, sanitized or not.
      - name: Configure (ASan/UBSan)
        run: |
          cmake -S . -B build-fallback-tests -DMEMBRANE_ENABLE_LLAMA=ON \
            -DCMAKE_BUILD_TYPE=Debug -DMEMBRANE_ENABLE_SANITIZERS=ON
      - name: Build (target-scoped -- no llama/ggml compilation)
        run: cmake --build build-fallback-tests -j2 --target test_auto_fallback test_joint_planner
      - name: Test
        run: |
          ctest --test-dir build-fallback-tests --output-on-failure \
            -R 'test_auto_fallback|test_joint_planner'

  # Mega Phase B, PR B1: same cheap target-scoped trick as fallback-
  # controller-tests above -- test_systemd_unit/test_server_config/
  # test_fs_util/test_subprocess (service_cmd.cpp's own pure building
  # blocks: unit-file generation, config serialization, atomic write,
  # subprocess injection safety) are all registered inside the
  # MEMBRANE_ENABLE_LLAMA CMake block (tools/membrane/CMakeLists.txt),
  # but none of their own libraries link llama/ggml at all, so a
  # target-scoped build compiles only these few translation units --
  # ASan/UBSan-affordable in the main CI matrix without paying the real
  # llama.cpp/ggml compile cost packaging-smoke/server-thread-sanitizer
  # already pay for the parts that genuinely need it (membrane_server,
  # via membrane_runtime_session -> llama.h). No real systemd/journalctl
  # is invoked by any of these four (test_subprocess exercises real
  # fork()/execvp() against ordinary coreutils -- echo/sh/sleep -- never
  # systemctl itself); the real `membrane service install/start/status/
  # stop/uninstall` integration path is covered separately by
  # packaging-smoke's own isolated-directory smoke step below, and the
  # real systemd --user lifecycle (this project targets Linux desktops/
  # workstations, where a --user session is normally already active) is
  # validated locally, not in CI -- see docs/service.md's own evidence
  # section.
  service-lifecycle-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure (ASan/UBSan)
        run: |
          cmake -S . -B build-service-lifecycle-tests \
            -DMEMBRANE_ENABLE_LLAMA=ON -DCMAKE_BUILD_TYPE=Debug \
            -DMEMBRANE_ENABLE_SANITIZERS=ON
      # Mega Phase B, PR B2: test_utf8_stream/test_stream_queue (the
      # streaming token callback's UTF-8-boundary helper and its bounded
      # concurrency queue -- both llama-free, same target-scoped-without-
      # llama trick) join the same cheap job. PR B3: test_request_
      # admission (the bounded pending-chat-request gate) joins too, same
      # reasoning. Mega Phase C, PR C1: test_doctor_cmd (membrane
      # doctor's own registry/config/service checks -- confirmed llama-
      # free directly: a target-scoped build of it alone compiles zero
      # llama/ggml files) joins too. test_setup_cmd is llama-LINKED
      # (setup_cmd.cpp calls into model_cmd.cpp, which needs real GGUF
      # validation via gpu_device.h) and lives in packaging-smoke below
      # instead, alongside test_registry_core/test_server.
      - name: Build (target-scoped -- no llama/ggml compilation)
        run: |
          cmake --build build-service-lifecycle-tests -j2 --target \
            test_systemd_unit test_server_config test_fs_util test_subprocess \
            test_utf8_stream test_stream_queue test_request_admission \
            test_doctor_cmd
      - name: Test
        run: |
          ctest --test-dir build-service-lifecycle-tests --output-on-failure \
            -R '^test_systemd_unit$|^test_server_config$|^test_fs_util$|^test_subprocess$|^test_utf8_stream$|^test_stream_queue$|^test_request_admission$|^test_doctor_cmd$'

  # Mega Phase B, PR B2: TSan cannot be combined with the ASan/UBSan
  # configure service-lifecycle-tests above already uses (see this
  # file's own build-and-test job comment / CMakeLists.txt's FATAL_ERROR
  # on combining MEMBRANE_ENABLE_SANITIZERS and MEMBRANE_ENABLE_TSAN), so
  # test_stream_queue's real multi-threaded producer/consumer coverage
  # -- the one piece of genuinely new concurrent code this PR adds --
  # gets its own separate, equally cheap (llama-free, target-scoped) TSan
  # job rather than being folded in. Same ASLR-retry precedent as
  # thread-sanitizer/server-thread-sanitizer above.
  stream-queue-thread-sanitizer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure (TSan)
        run: |
          cmake -S . -B build-stream-queue-tsan -DMEMBRANE_ENABLE_LLAMA=ON \
            -DCMAKE_BUILD_TYPE=Debug -DMEMBRANE_ENABLE_TSAN=ON
      - name: Build (target-scoped -- no llama/ggml compilation)
        run: cmake --build build-stream-queue-tsan -j2 --target test_stream_queue
      - name: Test
        run: |
          if ! ctest --test-dir build-stream-queue-tsan --output-on-failure -R '^test_stream_queue$'; then
            echo "Retrying under TSan with ASLR disabled (setarch -R)"
            setarch "$(uname -m)" -R ctest --test-dir build-stream-queue-tsan \
              --output-on-failure -R '^test_stream_queue$'
          fi

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, ASan]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure (Debug)
        if: matrix.build_type == 'Debug'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Configure (ASan)
        if: matrix.build_type == 'ASan'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMEMBRANE_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DMEMBRANE_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build-tsan -j

      # ThreadSanitizer aborts with "unexpected memory mapping" on kernels
      # whose ASLR range collides with its shadow. Try a normal run first;
      # only if that specific failure appears, retry with ASLR disabled.
      - name: Test
        run: |
          if ! ctest --test-dir build-tsan --output-on-failure; then
            echo "Retrying TSan tests with ASLR disabled (setarch -R)"
            setarch "$(uname -m)" -R ctest --test-dir build-tsan --output-on-failure
          fi

  # Mega Phase A, PR A3: a SEPARATE job from thread-sanitizer above --
  # that job never sets MEMBRANE_ENABLE_LLAMA, so it provides zero real
  # coverage of test_server (a genuinely multi-threaded HTTP server: one
  # background listener thread, httplib's own internal worker pool, one
  # mutex guarding shared per-model state) -- confirmed directly by
  # reading its own Configure step. Cannot use fallback-controller-tests'
  # cheaper target-scoped-without-llama trick (test_server, unlike
  # test_auto_fallback/test_joint_planner, genuinely needs llama.h via
  # membrane_server -> membrane_runtime_session), so this pays the same
  # real llama/ggml compile cost packaging-smoke already pays, just
  # target-scoped to the one binary that needs TSan coverage.
  server-thread-sanitizer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure (TSan + llama)
        run: |
          cmake -S . -B build-server-tsan -DMEMBRANE_ENABLE_LLAMA=ON \
            -DCMAKE_BUILD_TYPE=Debug -DMEMBRANE_ENABLE_TSAN=ON

      - name: Build (target-scoped)
        run: cmake --build build-server-tsan -j2 --target test_server

      - name: Test
        run: |
          # Anchored regex: since Mega Phase B, PR B1 added test_server_
          # config (prefix collision with test_server) as another test
          # registered in this same CMakeLists.txt, a bare, unanchored
          # "-R test_server" would also match it as "Not Run" (this job
          # only builds --target test_server, so test_server_config's own
          # binary was never built here) and fail the job for a reason
          # that has nothing to do with TSan -- confirmed as a real bug
          # this PR introduced and fixed in the same change, never left
          # for a later phase to trip over.
          if ! ctest --test-dir build-server-tsan --output-on-failure -R '^test_server$'; then
            echo "Retrying under TSan with ASLR disabled (setarch -R)"
            setarch "$(uname -m)" -R ctest --test-dir build-server-tsan \
              --output-on-failure -R '^test_server$'
          fi

  # Phase 17: catches install regressions like a backend shared library
  # (e.g. ggml-vulkan) missing from tools/membrane-run/CMakeLists.txt's
  # install rules -- the installed binary would build and link fine in
  # the build tree but fail with "cannot open shared object file" the
  # moment it's run from an install prefix. No real GPU is available or
  # required here: --help never touches a device, so the Vulkan leg
  # validates configure/build/install/RPATH correctness, not runtime
  # GPU behavior (see README's "Limitations" -- real Vulkan runtime
  # evidence stays local/manual).
  packaging-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev glslc vulkan-tools \
            spirv-headers dpkg-dev

      - name: CPU configure
        run: |
          cmake -S . -B build-cpu-install \
            -DMEMBRANE_ENABLE_LLAMA=ON -DCMAKE_BUILD_TYPE=Release

      # -j2, not unbounded -j: GitHub-hosted standard runners have 2
      # vCPUs / ~7 GiB RAM, and llama.cpp's largest translation units
      # are memory-hungry enough that unbounded parallelism here was
      # confirmed directly to OOM-kill the build (SIGTERM, exit 143,
      # ~98% through -- the existing build-and-test/thread-sanitizer
      # jobs' own unbounded -j is unaffected: they never set
      # MEMBRANE_ENABLE_LLAMA, so they never compile llama.cpp/ggml at
      # all).
      - name: CPU build
        run: |
          cmake --build build-cpu-install -j2 --target membrane-run \
            membrane test_runtime_session test_registry_core test_server \
            test_setup_cmd

      # Mega Phase A, PR A1: this is the ONLY CI coverage test_runtime_
      # session gets (same pre-existing gap fallback-controller-tests
      # documents for test_auto_fallback/test_joint_planner above -- the
      # main build-and-test/thread-sanitizer jobs never set MEMBRANE_
      # ENABLE_LLAMA) -- piggybacked on this job's own already-necessary
      # llama/ggml build (this test genuinely needs llama.h, unlike
      # test_auto_fallback/test_joint_planner, so it cannot use fallback-
      # controller-tests' cheaper target-scoped-without-llama trick).
      # CI-safe by construction: no real GGUF model file is required
      # (models/ is gitignored) -- see test_runtime_session.cpp's own
      # top comment. PR A3's test_server joins the same list for the
      # same reason (a real httplib::Server needs llama.h too, via
      # membrane_server -> membrane_runtime_session).
      # Anchored alternation: Mega Phase B, PR B1 added test_server_config
      # (prefix collision with test_server) to this same CMakeLists.txt --
      # an unanchored "test_server" alternative would also match it as
      # "Not Run" here (this step only builds test_runtime_session/test_
      # registry_core/test_server above, not test_server_config), failing
      # this job for a reason unrelated to any of the three real tests it
      # means to run. Each alternative anchored individually so future
      # test names sharing a prefix with any of these three don't
      # silently reintroduce the same bug.
      # Mega Phase C, PR C1: test_setup_cmd joins the same list -- it
      # too genuinely needs llama.h (setup_cmd.cpp calls into model_
      # cmd.cpp, which needs real GGUF validation via gpu_device.h).
      - name: Test runtime-session core, model registry, HTTP server, and setup
        run: |
          ctest --test-dir build-cpu-install --output-on-failure \
            -R '^test_runtime_session$|^test_registry_core$|^test_server$|^test_setup_cmd$'

      - name: CPU install to temp prefix
        run: |
          cmake --install build-cpu-install --prefix /tmp/membrane-install-cpu

      - name: CPU installed binary runs outside the build tree
        run: |
          cd /tmp
          /tmp/membrane-install-cpu/bin/membrane-run --version
          /tmp/membrane-install-cpu/bin/membrane-run --help
          /tmp/membrane-install-cpu/bin/membrane-run --doctor
          # Phase 35, Section 45: the installed binary must document the
          # new --ctx N|auto value -- confirms the packaged build
          # actually contains this phase's CLI change, not just that
          # --help doesn't crash.
          /tmp/membrane-install-cpu/bin/membrane-run --help | grep -q -- '--ctx N|auto'

      # Mega Phase A, PR A2: the new `membrane` control CLI installs and
      # runs outside the build tree too -- a real end-to-end model add/
      # list/inspect/remove cycle against a temp registry (MEMBRANE_
      # MODELS_PATH override, never the runner's own $HOME) using the
      # already-installed membrane-run binary's own model file is not
      # available here (no real GGUF model in CI -- models/ is
      # gitignored), so this only proves the installed binary's CLI
      # surface itself (--help/--version/error paths), matching --doctor's
      # own no-model-needed precedent above.
      - name: CPU installed membrane control CLI runs outside the build tree
        run: |
          cd /tmp
          /tmp/membrane-install-cpu/bin/membrane --version
          /tmp/membrane-install-cpu/bin/membrane --help
          /tmp/membrane-install-cpu/bin/membrane model list --json > /dev/null
          # A nonexistent model path is EXPECTED to exit 3 -- capture the
          # real exit code explicitly rather than letting `set -e` (this
          # step's own shell mode) abort the script on that expected
          # nonzero exit before the check below ever runs.
          set +e
          MEMBRANE_MODELS_PATH=/tmp/ci-membrane-models.json \
            /tmp/membrane-install-cpu/bin/membrane model add ghost \
            /nonexistent.gguf
          rc=$?
          set -e
          if [ "$rc" -ne 3 ]; then
            echo "expected exit 3 for a nonexistent model path, got $rc"
            exit 1
          fi
          rm -f /tmp/ci-membrane-models.json

      # Mega Phase A, PR A3: the installed `membrane serve` binary really
      # starts, listens, answers /health, and stops cleanly on SIGTERM --
      # no real GGUF model needed (empty registry; real chat-completion
      # generation is covered by test_server's own request-validation
      # suite above plus the dev-local end-to-end smoke, not CI).
      - name: CPU installed membrane serve starts, answers, and stops cleanly
        run: |
          MEMBRANE_MODELS_PATH=/tmp/ci-serve-models.json \
            /tmp/membrane-install-cpu/bin/membrane serve --port 18942 &
          server_pid=$!
          ready=0
          for _ in $(seq 1 50); do
            if curl -sf http://127.0.0.1:18942/health > /tmp/ci-health.json; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            echo "membrane serve never answered /health"
            kill -KILL "$server_pid" 2>/dev/null || true
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/ci-health.json
          kill -TERM "$server_pid"
          for _ in $(seq 1 50); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$server_pid" 2>/dev/null; then
            echo "membrane serve did not exit within 5s of SIGTERM"
            kill -KILL "$server_pid" 2>/dev/null || true
            exit 1
          fi
          rm -f /tmp/ci-serve-models.json /tmp/ci-health.json

      # Mega Phase B, PR B1: real `membrane service install/uninstall`
      # through the installed binary's own CLI dispatch -- MEMBRANE_
      # SYSTEMD_USER_DIR/MEMBRANE_SERVER_CONFIG_PATH point at isolated
      # temp locations (never a real systemd --user unit directory or
      # this runner's own $HOME), so this is CI-safe with no assumption
      # that a real systemd --user session/journalctl is available or
      # working here. `install` still runs a real `systemctl --user
      # daemon-reload` internally, but its result is intentionally
      # never checked (see service_cmd.cpp's cmd_install) -- so install
      # succeeds here whether or not this runner has a working --user
      # session, exactly the "mock command runner if systemd
      # unavailable in CI" allowance Section 13 of the Mega Phase B
      # task calls for, minus an actual mock: the real code path
      # already tolerates a real absence gracefully, so no separate
      # mock layer was needed. `service start/stop/status` themselves
      # DO require a real, working systemd --user session (they check
      # systemctl's exit code) and are NOT exercised here -- that real
      # lifecycle is validated locally against this project's own dev
      # workstation, see docs/service.md's evidence section.
      - name: CPU installed membrane service install/uninstall (isolated dirs)
        run: |
          export MEMBRANE_SYSTEMD_USER_DIR=/tmp/ci-membrane-systemd-user
          export MEMBRANE_SERVER_CONFIG_PATH=/tmp/ci-membrane-server.json
          mkdir -p "$MEMBRANE_SYSTEMD_USER_DIR"
          /tmp/membrane-install-cpu/bin/membrane service install --exec-path \
            /tmp/membrane-install-cpu/bin/membrane
          grep -q 'Generated by `membrane service install`' \
            "$MEMBRANE_SYSTEMD_USER_DIR/membrane.service"
          grep -q 'ExecStart="/tmp/membrane-install-cpu/bin/membrane" serve' \
            "$MEMBRANE_SYSTEMD_USER_DIR/membrane.service"
          test -f "$MEMBRANE_SERVER_CONFIG_PATH"
          # A second install without --force must refuse to clobber a unit
          # this project did not generate (Section 12's own safety rule) --
          # simulate that by seeding an unrelated, unmarked unit first.
          mkdir -p /tmp/ci-membrane-systemd-user-2
          printf '[Unit]\nDescription=Not MEMBRANE\n' \
            > /tmp/ci-membrane-systemd-user-2/membrane.service
          set +e
          MEMBRANE_SYSTEMD_USER_DIR=/tmp/ci-membrane-systemd-user-2 \
            /tmp/membrane-install-cpu/bin/membrane service install --exec-path \
            /tmp/membrane-install-cpu/bin/membrane
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "install must refuse to overwrite a non-MEMBRANE-managed unit without --force"
            exit 1
          fi
          /tmp/membrane-install-cpu/bin/membrane service uninstall
          if [ -f "$MEMBRANE_SYSTEMD_USER_DIR/membrane.service" ]; then
            echo "uninstall did not remove the unit file"
            exit 1
          fi
          rm -rf /tmp/ci-membrane-systemd-user /tmp/ci-membrane-systemd-user-2 \
            /tmp/ci-membrane-server.json

      - name: CPU uninstall removes exactly the installed files
        run: |
          cmake --build build-cpu-install --target uninstall
          remaining=$(find /tmp/membrane-install-cpu -type f | wc -l)
          if [ "$remaining" -ne 0 ]; then
            echo "uninstall left $remaining file(s) behind:"
            find /tmp/membrane-install-cpu -type f
            exit 1
          fi

      # Phase 29: deliberately AFTER uninstall above, not before --
      # cpack's own internal install step re-runs this build directory's
      # cmake_install.cmake into CPack's staging area, which overwrites
      # this SAME build directory's install_manifest.txt (CMake always
      # writes it to <build-dir>/install_manifest.txt, regardless of
      # which --prefix produced it) -- running cpack before the
      # uninstall step above corrupted the manifest the uninstall step
      # needed, a real CI failure confirmed directly (uninstall then
      # left 6 real files behind at /tmp/membrane-install-cpu because
      # it was reading a manifest cpack had already replaced with its
      # own staging paths). Reuses the already-built membrane-run above
      # -- cpack (not `cmake --build --target package`) only re-runs
      # the install step + packaging, no rebuild of the rest of the
      # tree. CPU package is the mandatory candidate (Section 25); no
      # release is published here, just a CI artifact. Phase 30:
      # CPACK_PACKAGE_NAME is "membrane-cpu" for a non-Vulkan configure
      # (CMakeLists.txt) -- this variant is a CI-validation/build-your-
      # own artifact, NOT the official release package (see
      # docs/install.md and results/release-artifacts/manifest.json).
      - name: CPU build .deb package
        run: cd build-cpu-install && cpack -G DEB

      - name: Upload CPU .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: membrane-cpu-deb
          path: build-cpu-install/membrane-cpu_*.deb
          if-no-files-found: error

      - name: Vulkan configure
        run: |
          cmake -S . -B build-vulkan-install \
            -DMEMBRANE_ENABLE_LLAMA=ON -DGGML_VULKAN=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Vulkan build
        run: |
          cmake --build build-vulkan-install -j2 --target membrane-run \
            membrane

      - name: Vulkan install to temp prefix
        run: |
          cmake --install build-vulkan-install \
            --prefix /tmp/membrane-install-vulkan

      - name: Vulkan installed binary runs outside the build tree
        run: |
          cd /tmp
          /tmp/membrane-install-vulkan/bin/membrane-run --version
          /tmp/membrane-install-vulkan/bin/membrane-run --help
          /tmp/membrane-install-vulkan/bin/membrane-run --help | grep -q -- '--ctx N|auto'
          /tmp/membrane-install-vulkan/bin/membrane-run --list-devices
          /tmp/membrane-install-vulkan/bin/membrane-run --doctor

      - name: Uninstall removes exactly the installed files
        run: |
          cmake --build build-vulkan-install --target uninstall
          remaining=$(find /tmp/membrane-install-vulkan -type f | wc -l)
          if [ "$remaining" -ne 0 ]; then
            echo "uninstall left $remaining file(s) behind:"
            find /tmp/membrane-install-vulkan -type f
            exit 1
          fi

      # Phase 29: deliberately AFTER uninstall above -- see the CPU
      # leg's own comment for why (cpack's internal install step
      # overwrites this build directory's install_manifest.txt, which
      # the uninstall step above still needs to be correct). CI's
      # Vulkan build has always been reliable here (Phase 17), so this
      # is built alongside the CPU one rather than skipped (Section 25
      # makes it mandatory only for CPU, optional for Vulkan "if the CI
      # environment can build it reliably" -- it can). Phase 30: this
      # is now the OFFICIAL release package candidate (CPACK_PACKAGE_
      # NAME "membrane", unchanged filename) -- proven to run correctly
      # CPU-only with zero devices visible (this very job has no GPU),
      # see docs/install.md's package policy.
      - name: Vulkan build .deb package
        run: cd build-vulkan-install && cpack -G DEB

      - name: Upload Vulkan .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: membrane-vulkan-deb
          path: build-vulkan-install/membrane_*.deb
          if-no-files-found: error
