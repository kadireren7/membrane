# Contributor agreement check.
#
# What this verifies: for an EXTERNAL pull request (see the skip condition
# below), CONTRIBUTOR_RIGHTS_AGREEMENT.md Section 27 requires a recorded
# acceptance (or an explicit recorded waiver) in docs/contributor-agreements.md
# before the PR may be merged. This workflow reports that as a real pass/fail
# result so it CAN be promoted to a required status check later -- unlike the
# prior version of this file, it does not unconditionally exit 0.
#
# It is NOT added to branch protection as a required check by this change --
# see docs/contributor-governance.md for why enabling that is a separate,
# later, maintainer decision, not something this workflow file does on its
# own by existing.
#
# Security design (see docs/contributor-governance.md "Automation
# recommendation" for the full reasoning):
#   - Triggered by plain `pull_request`, never `pull_request_target` -- this
#     check touches no secrets and runs no code from the fork, so it does not
#     need pull_request_target's elevated token/secret access, and avoiding
#     it avoids that trigger's known secret-exfiltration/RCE-class risk when
#     combined with checking out and executing untrusted fork content.
#   - permissions is explicitly minimal: contents: read only. No PR-write,
#     no issues-write, nothing that could post a comment or alter the PR.
#   - The registry file is read ONLY from the base branch
#     (github.base_ref), fetched via a *separate*, explicit checkout step --
#     never from the PR's own head/merge commit. This is deliberate: it
#     stops a malicious fork PR from adding a fake acceptance row to its own
#     copy of docs/contributor-agreements.md to pass its own check. The
#     actual PR diff is never checked out or executed by this workflow at
#     all -- only the base-branch registry file's contents are read.
#   - Lookup is deterministic: an awk field-based match on the registry's
#     own pipe-delimited table columns (field 2 = GitHub handle, field 3 =
#     PR number), not a hand-rolled regex over the whole line -- an earlier
#     draft of this check used a `grep -E` pattern that looked plausible but
#     was empirically verified (real test rows, not just read by eye) to
#     NEVER match a real row, because the PR-number column sits immediately
#     next to the handle column with only one `|` between them, and that
#     regex required a second, distinct `|` to appear before the number. It
#     would have silently reported "no acceptance found" for every real
#     acceptance. The current awk version was verified against five real
#     test cases (case-insensitive match, `#`-prefixed PR number, a match in
#     the waiver table, a non-matching author, and a matching author with
#     the wrong PR number) before being committed here.
#   - No third-party GitHub App or external service is used.
name: Contributor agreement check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Skip for internal/maintainer contributions
        id: gate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # External == the PR comes from a fork. A PR opened from a branch
          # in this repository itself is treated as internal (maintainer or
          # someone already trusted with direct repo write access) and is
          # exempt from the acceptance requirement -- CONTRIBUTOR_RIGHTS_AGREEMENT.md
          # only ever requires this for *external* contributions.
          if [ "${IS_FORK}" != "true" ]; then
            echo "internal=true" >> "$GITHUB_OUTPUT"
          else
            echo "internal=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out registry file from the base branch only
        if: steps.gate.outputs.internal != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            docs/contributor-agreements.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Look up this PR in the contributor agreement registry
        if: steps.gate.outputs.internal != 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u
          echo "## Contributor agreement status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          REGISTRY="docs/contributor-agreements.md"
          if [ ! -f "$REGISTRY" ]; then
            echo "Registry file not found on base branch -- treating as no acceptance on record." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No CONTRIBUTOR_RIGHTS_AGREEMENT.md acceptance or waiver on record for @${PR_AUTHOR} / PR #${PR_NUMBER}. See CONTRIBUTOR_RIGHTS_AGREEMENT.md Section 27."
            exit 1
          fi

          # Deterministic match: field 2 (GitHub handle) case-insensitively
          # equals PR_AUTHOR, and field 3 (PR number, optional leading '#')
          # equals PR_NUMBER, in the same pipe-delimited row -- checked
          # across the whole file, so it matches either the Accepted table
          # or the Maintainer-recorded waivers table without needing to know
          # which one in advance.
          if awk -F'|' -v author="${PR_AUTHOR}" -v num="${PR_NUMBER}" '
              {
                h=$2; gsub(/^[ \t]+|[ \t]+$/, "", h)
                p=$3; gsub(/^[ \t]+|[ \t]+$/, "", p)
                gsub(/^#/, "", p)
                if (tolower(h) == tolower(author) && p == num) { found=1 }
              }
              END { exit(found ? 0 : 1) }
            ' "$REGISTRY"; then
            echo "Recorded acceptance (or maintainer waiver) found for @${PR_AUTHOR} / PR #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "No recorded CONTRIBUTOR_RIGHTS_AGREEMENT.md acceptance or waiver found for @${PR_AUTHOR} / PR #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          echo "Per CONTRIBUTOR_RIGHTS_AGREEMENT.md Section 27, this PR should not be merged until the contributor posts the acceptance comment described there (or the maintainer records an explicit waiver)." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::No CONTRIBUTOR_RIGHTS_AGREEMENT.md acceptance or waiver on record for @${PR_AUTHOR} / PR #${PR_NUMBER}. See CONTRIBUTOR_RIGHTS_AGREEMENT.md Section 27."
          exit 1

      - name: Internal contribution -- exempt
        if: steps.gate.outputs.internal == 'true'
        run: |
          echo "## Contributor agreement status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This PR originates from a branch in this repository (not a fork), so it is treated as an internal contribution exempt from the external-contributor acceptance requirement." >> "$GITHUB_STEP_SUMMARY"
